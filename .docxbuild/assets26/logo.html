<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Helvetica Neue',Arial,sans-serif}
.lockup{display:flex;align-items:center;gap:26px;padding:34px 40px}
.word{font-size:78px;font-weight:800;letter-spacing:.11em;color:#1F3864;line-height:1}
.word em{font-style:normal;color:#D97706}
.tag{font-size:17.5px;letter-spacing:.30em;color:#6B7A8D;text-transform:uppercase;margin-top:11px;font-weight:600}
</style>
<div class="lockup">
  <svg width="140" height="140" viewBox="0 0 100 100" role="img" aria-label="SPIREXA mark">
    <!-- scan arcs: satellite watching the slope -->
    <path d="M22 34 A 34 34 0 0 1 78 34" fill="none" stroke="#D97706" stroke-width="4.2" stroke-linecap="round" opacity=".95"/>
    <path d="M31 25 A 24 24 0 0 1 69 25" fill="none" stroke="#D97706" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
    <!-- the slope: two peaks, the right one fracturing -->
    <path d="M8 86 L38 40 L56 66 L69 47 L92 86 Z" fill="#1F3864"/>
    <!-- failure plane -->
    <path d="M60 58 L78 86" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
    <!-- sensor node on the ridge -->
    <circle cx="38" cy="40" r="6.4" fill="#fff"/>
    <circle cx="38" cy="40" r="3.5" fill="#D97706"/>
  </svg>
  <div>
    <div class="word">SPIR<em>E</em>XA</div>
    <div class="tag">Landslide Intelligence</div>
  </div>
</div>
